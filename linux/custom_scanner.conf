# Configuration of the custom_scanner SANE backend (virtual scanner).
#
# This file is optional: every key has a built-in default. The same keys can
# also be set as environment variables (see linux/README.md), which is handy
# for one-off tests:
#
#   CUSTOM_SCANNER_IMAGE_DIR=/home/me/pictures scanimage -d custom_scanner:virtual > out.pnm
#
# Lines starting with '#' are comments; "key = value" and "key value" are both
# accepted. Unknown keys are ignored.

# Directory holding the images that are handed out as "scans".
#
# Every .pnm, .ppm and .pgm file in it is used; they are sorted in natural
# order (2.pnm before 10.pnm). Convert other formats with ImageMagick:
#
#   convert input.png -depth 8 output.pnm
#
# If a single image should be returned over and over again instead of cycling
# through a directory, set the "image" key below.
directory = /usr/share/custom_scanner/images
#image = /home/me/pictures/document.pnm

# How a scan job uses the image set:
#   auto   (default) flatbed -> one image per scan job, document feeder (ADF)
#                     -> every image in the set, one page per sane_start
#   cycle  always one image per scan job (the next image on the next scan)
#   adf    always a multi page job, one page per image in the set
#   single always the same image (like a scanner with a single page loaded)
mode = auto

# Maximum number of pages returned by one multi page (ADF) scan job.
# 0 (default) = every image of the set, like "maxcount" of the Windows
# virtual scanner.
#maxcount = 0

# Start the image set at a fixed position instead of cycling through it.
#index = 0

# Where the position inside the image set is remembered between scan jobs
# (the equivalent of the Windows info.json "index" field).
#state_file = ~/.local/state/custom_scanner/index

# Channel order of the RGB data handed to the frontend:
#   gbr  legacy behaviour of this backend (default, kept for compatibility
#        with the Dynamic Web TWAIN demo)
#   rgb  plain RGB, use this for scanimage/xsane and anything that expects
#        standard SANE RGB frames
#channel_order = gbr

# Name the device is advertised with. The SANE dll layer prefixes it with the
# backend name, so "virtual" shows up as "custom_scanner:virtual".
#device_name = virtual
